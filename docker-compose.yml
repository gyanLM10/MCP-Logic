version: '3.8'

services:
  # 1. Chat Database (Memory)
  db:
    image: postgres:15-alpine
    container_name: mifos_ai_db
    restart: always
    environment:
      POSTGRES_USER: mifos
      POSTGRES_PASSWORD: password
      POSTGRES_DB: mifos_chat
    volumes:
      - mifos_chat_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U mifos -d mifos_chat" ]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. FastAPI Backend & Agent
  backend:
    build: ./backend
    container_name: mifos_ai_backend
    restart: always
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    environment:
      - OLLAMA_MODEL=qwen2.5:7b
      # Since we pull the repo inside the dockerfile, the path is static
      - MCP_SERVER_PATH=/opt/mcp-mifosx/Python/MCP-Server-Python-Implementation/mcp_server.py
      - DATABASE_URL=postgresql://mifos:password@db:5432/mifos_chat
      # Pass through to the MCP Server
      - MIFOSX_BASE_URL=${MIFOSX_BASE_URL:-https://172.17.0.1:8443/fineract-provider/api/v1}
      - MIFOSX_TENANT_ID=${MIFOSX_TENANT_ID:-default}
      - MIFOSX_USERNAME=${MIFOSX_USERNAME:-mifos}
      - MIFOSX_PASSWORD=${MIFOSX_PASSWORD:-password}
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # 3. Angular Web UI (Nginx)
  frontend:
    build: ./frontend
    container_name: mifos_ai_frontend
    restart: always
    depends_on:
      - backend
    ports:
      - "4200:80"

volumes:
  mifos_chat_data:
